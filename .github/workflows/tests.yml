name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Decide whether this change needs the full test suite. Docs-only changes
  # (Markdown, docs/, LICENSE, images) and a version-only bump of manifest.json
  # can't affect any test outcome, so the heavy jobs below are skipped for them.
  # hassfest (validate) and HACS Action still run unconditionally in their own
  # workflows, so a version bump's manifest is always validated.
  #
  # The three skippable jobs are gated with a job-level `if:` (not a trigger
  # `paths-ignore`): a skipped required check reports "skipped" and counts as
  # passing, whereas a path-ignored required check hangs "pending" forever and
  # blocks the merge.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.detect.outputs.run_tests }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect whether tests need to run
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          # Any failure to work out the diff falls back to running the full
          # suite — never silently skip because detection broke.
          emit() { echo "run_tests=$1" >> "$GITHUB_OUTPUT"; echo "decision: run_tests=$1"; exit 0; }

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"; head="$PR_HEAD_SHA"
          else
            base="$PUSH_BEFORE_SHA"; head="$PUSH_AFTER_SHA"
          fi

          # A missing/zero base (new branch, shallow history) → run everything.
          git rev-parse --verify --quiet "${base}^{commit}" >/dev/null 2>&1 || emit true
          git rev-parse --verify --quiet "${head}^{commit}" >/dev/null 2>&1 || emit true

          changed="$(git diff --name-only "${base}...${head}" 2>/dev/null)" || emit true
          echo "changed files:"; printf '  %s\n' $changed

          # Strip the skip-eligible doc/asset paths; whatever remains decides.
          remaining="$(printf '%s\n' "$changed" \
            | grep -vE '\.md$|^docs/|^LICENSE$|\.(png|jpe?g|gif|svg|webp|ico)$' \
            | sed '/^$/d' || true)"

          MANIFEST="custom_components/cover_time_based/manifest.json"

          if [ -z "$remaining" ]; then
            emit false                                   # docs/assets only
          elif [ "$remaining" = "$MANIFEST" ]; then
            # Only the manifest changed — skip only if it's a version-line-only
            # bump. Any other manifest edit (e.g. requirements) runs the suite.
            # Count added/removed lines (excluding the ---/+++ headers) that are
            # not the "version" line; a count-based test is portable where a
            # `grep -vq` early-exit is not.
            nonversion="$(git diff "${base}...${head}" -- "$MANIFEST" \
              | grep -E '^[+-]' \
              | grep -vE '^[+-]{3} ' \
              | grep -vcE '^[+-][[:space:]]*"version":' || true)"
            if [ "${nonversion:-0}" -gt 0 ]; then
              emit true                                  # a non-version line changed
            else
              emit false                                 # version-only bump
            fi
          else
            emit true
          fi

  test:
    name: test (${{ matrix.ha-channel }}, py${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each HA channel runs on the lowest Python its HA pin supports.
        # stable + dev track current HA, which (2026.3+) requires Python 3.14.
        # minimum pins our declared floor (HA 2025.2.0); its pytest-homeassistant-
        # custom-component only supports 3.13, so that leg stays on 3.13 to keep
        # proving the floor still works. (pytest-homeassistant-custom-component
        # capped at 3.13 can't resolve HA past 2026.2.x, which is why stable must
        # run on 3.14 to actually exercise the latest HA.)
        include:
          - { ha-channel: stable, python-version: "3.14" }
          - { ha-channel: dev, python-version: "3.14" }
          - { ha-channel: minimum, python-version: "3.13" }
    continue-on-error: ${{ matrix.ha-channel == 'dev' }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (stable)
        if: matrix.ha-channel == 'stable'
        run: |
          python -m pip install --upgrade pip
          # pytest-homeassistant-custom-component pins the latest stable HA it
          # supports (2026.6.x on Python 3.14) along with its whole pytest stack,
          # so this single install is sufficient.
          python -m pip install pytest-homeassistant-custom-component

      - name: Install dependencies (dev)
        if: matrix.ha-channel == 'dev'
        run: |
          python -m pip install --upgrade pip
          # Newest release including prereleases -> dev/beta HA.
          python -m pip install --pre pytest-homeassistant-custom-component

      - name: Install dependencies (minimum)
        if: matrix.ha-channel == 'minimum'
        run: |
          python -m pip install --upgrade pip
          # Our declared floor: this pin resolves HA 2025.2.0 (matches hacs.json),
          # the oldest HA we commit to supporting. Supports Python 3.13.
          python -m pip install "pytest-homeassistant-custom-component==0.13.210"

      - name: Run tests
        run: pytest tests/ -v

  frontend:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests with coverage gate
        run: npm run test:fe:cov

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Check linting (ESLint)
        run: npm run lint

  lint:
    needs: changes
    if: needs.changes.outputs.run_tests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install ruff
        # Unpinned on purpose — we want the latest ruff. What keeps that from
        # turning the job red on an untouched tree is the explicit rule set in
        # pyproject.toml ([tool.ruff.lint].select), not a version pin: a bare
        # `ruff check` follows ruff's *default* rules, which shift between
        # releases (0.16.0 expanded them and surfaced 125 findings here). Pinning
        # the rules we enforce, rather than the version, lets us stay current.
        run: python -m pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Check linting
        run: ruff check .
