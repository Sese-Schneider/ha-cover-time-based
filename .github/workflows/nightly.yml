name: Nightly (latest deps)

# Exercises the integration against the newest upstream dependencies every day,
# separately from PR CI (.github/workflows/tests.yml), which pins specific HA
# channels. This is the early-warning system for HA-side drift: it installs the
# newest stable, beta and dev HA with their test harness and runs the suite. A
# failure on any of the three fails the run, and a job that does not end up on
# the HA version it asked for fails too.
#
# hassfest + HACS already validate daily in hassfest.yml and hacs.yml (same
# @master/@main actions on a cron), so this workflow only adds the
# pytest-against-latest leg they don't cover.

on:
  schedule:
    - cron: "29 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-latest:
    name: pytest (latest HA + harness, ${{ matrix.ha-channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha-channel: ["stable", "beta", "dev"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # The newest HA requires Python 3.14 (see tests.yml stable leg).
          python-version: "3.14"

      - name: Install latest Home Assistant + test harness
        run: |
          python -m pip install --upgrade pip
          python scripts/ci_ha_install.py "${{ matrix.ha-channel }}"
          python -c "from homeassistant.const import __version__; print(__version__)"

      - name: Run tests
        run: pytest tests/ -v
